<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SimpliGame">
  <defs>
    <linearGradient id="sg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04BEF1" />
      <stop offset="1" stop-color="#048DF1" />
    </linearGradient>
  </defs>
  <!-- SG lettermark: white letters, Vegas gold outline, on the brand-blue tile.
       Text sized to survive maskable cropping on Android home screens. -->
  <rect width="512" height="512" rx="112" fill="url(#sg-bg)" />
  <text x="256" y="338" font-family="Arial, Helvetica, sans-serif" font-size="250" font-weight="900" fill="#ffffff" stroke="#B4975A" stroke-width="13" stroke-linejoin="round" paint-order="stroke" text-anchor="middle" letter-spacing="-7">SG</text>
</svg>
